name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run tests
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
          check-latest: true

      - name: Test
        run: go test ./...

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        shell: bash
        run: |
          previous_tag=$(git describe --tags --match "v[0-9]*" --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          repository_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

          {
            echo "### What's Changed"
            echo
            if [[ -n "$previous_tag" ]]; then
              git log --reverse --format="- %s [\`%h\`](${repository_url}/commit/%H)" "${previous_tag}..${GITHUB_REF_NAME}"
              echo
              echo "**Full Changelog:** [${previous_tag}...${GITHUB_REF_NAME}](${repository_url}/compare/${previous_tag}...${GITHUB_REF_NAME})"
            else
              git log --reverse --format="- %s [\`%h\`](${repository_url}/commit/%H)" "$GITHUB_REF_NAME"
            fi
          } > /tmp/release-notes.md

      - name: Release with goreleaser-cross
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
        run: |
          docker run --rm \
            -e GITHUB_TOKEN="$GITHUB_TOKEN" \
            -e GH_PAT="$GH_PAT" \
            -e AUR_KEY="$AUR_KEY" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.docker/config.json":/root/.docker/config.json \
            -v "$PWD":/work \
            -w /work \
            --entrypoint /bin/sh \
            ghcr.io/goreleaser/goreleaser-cross:latest \
            -lc 'apt-get update >/dev/null && apt-get install -y patchelf >/dev/null && git config --global --add safe.directory /work && go mod download && goreleaser check && goreleaser release --clean'

      - name: Update GitHub release notes
        uses: softprops/action-gh-release@v3
        with:
          body_path: /tmp/release-notes.md
