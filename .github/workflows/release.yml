name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "stable"
          check-latest: true

      - name: Test
        run: go test ./...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        uses: hyperpuncher/release-notes@v1
        id: notes

      - name: Release with goreleaser-cross
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
        run: |
          docker run --rm \
            -e GITHUB_TOKEN="$GITHUB_TOKEN" \
            -e GH_PAT="$GH_PAT" \
            -e AUR_KEY="$AUR_KEY" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.docker":/root/.docker \
            -v "$PWD":/work \
            -w /work \
            --entrypoint /bin/sh \
            ghcr.io/goreleaser/goreleaser-cross:latest \
            -lc 'apt-get update >/dev/null && apt-get install -y patchelf >/dev/null && git config --global --add safe.directory /work && go mod download && goreleaser check && goreleaser release --clean'

      - name: Update GitHub release notes
        if: ${{ !cancelled() && steps.notes.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: ${{ steps.notes.outputs.path }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --notes-file "$NOTES_FILE"
          fi
