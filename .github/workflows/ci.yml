name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Lint Go
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Install workflow linters
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@latest

      - name: Lint workflows
        run: actionlint

      - name: Lint shell scripts
        run: shellcheck benchmarks/*.sh scripts/*.sh

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Scan Go dependencies
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: stable
          check-latest: true
          go-package: ./...
