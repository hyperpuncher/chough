services:
  chough:
    image: ghcr.io/hyperpuncher/chough:latest

    container_name: chough
    ports:
      - "8080:8080"
    volumes:
      # Persist model cache to avoid re-downloading ~650MB on restart
      - chough-models:/home/chough/.cache/chough/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--output-document=/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s # Give time for initial model download

volumes:
  chough-models:
    driver: local
