# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

project_name: chough
version: 2

before:
  hooks:
    - ./scripts/stage-sherpa-libs.sh

builds:
  - id: linux-amd64
    main: ./cmd/chough
    binary: chough
    goos: [linux]
    goarch: [amd64]
    env:
      - CGO_ENABLED=1
      - CC=x86_64-linux-gnu-gcc
      - CXX=x86_64-linux-gnu-g++
    ldflags:
      - -s -w -X main.version={{ .Tag }}
    hooks:
      post:
        - cmd: ./scripts/fix-runtime-paths.sh {{ .Path }} linux amd64

  - id: darwin-amd64
    main: ./cmd/chough
    binary: chough
    goos: [darwin]
    goarch: [amd64]
    env:
      - CGO_ENABLED=1
      - CC=o64-clang
      - CXX=o64-clang++
      - MACOSX_DEPLOYMENT_TARGET=13.0
    ldflags:
      - -s -w -X main.version={{ .Tag }}
    hooks:
      post:
        - cmd: ./scripts/fix-runtime-paths.sh {{ .Path }} darwin amd64

  - id: darwin-arm64
    main: ./cmd/chough
    binary: chough
    goos: [darwin]
    goarch: [arm64]
    env:
      - CGO_ENABLED=1
      - CC=oa64-clang
      - CXX=oa64-clang++
      - MACOSX_DEPLOYMENT_TARGET=13.0
    ldflags:
      - -s -w -X main.version={{ .Tag }}
    hooks:
      post:
        - cmd: ./scripts/fix-runtime-paths.sh {{ .Path }} darwin arm64

  - id: windows-amd64
    main: ./cmd/chough
    binary: chough-bin
    goos: [windows]
    goarch: [amd64]
    env:
      - CGO_ENABLED=1
      - CC=x86_64-w64-mingw32-gcc
      - CXX=x86_64-w64-mingw32-g++
    ldflags:
      - -s -w -X main.version={{ .Tag }}

  - id: windows-shim-amd64
    main: ./cmd/chough-shim
    binary: chough
    goos: [windows]
    goarch: [amd64]
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Tag }}

archives:
  - name_template: >-
      {{ .ProjectName }}_{{ .Tag }}_{{ .Os }}_{{- if eq .Arch "amd64" -}}x86_64{{- else -}}{{ .Arch }}{{- end -}}
    allow_different_binary_count: true
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - src: .tmp-libbundle/current/{{ .Os }}_{{ .Arch }}/*
        strip_parent: true

checksum:
  name_template: checksums.txt

changelog:
  disable: true

homebrew_casks:
  - name: chough
    description: Fast ASR CLI using Parakeet TDT 0.6b V3
    homepage: https://github.com/hyperpuncher/chough
    license: MIT
    binaries: [chough]
    dependencies:
      - formula: ffmpeg
    repository:
      owner: hyperpuncher
      name: homebrew-tap
      branch: main
      token: "{{ .Env.GH_PAT }}"
    directory: Casks
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}"]
          end

winget:
  - name: chough
    package_identifier: hyperpuncher.chough
    publisher: hyperpuncher
    publisher_url: https://github.com/hyperpuncher
    publisher_support_url: https://github.com/hyperpuncher/chough/issues
    short_description: Fast ASR CLI using Parakeet TDT 0.6b V3
    description: Fast, memory-efficient ASR CLI using sherpa-onnx with chunked processing.
    homepage: https://github.com/hyperpuncher/chough
    license: MIT
    license_url: https://github.com/hyperpuncher/chough/blob/main/LICENSE
    release_notes_url: https://github.com/hyperpuncher/chough/releases/tag/{{ .Tag }}
    tags: [asr, transcription, speech-to-text, cli]
    dependencies:
      - package_identifier: Gyan.FFmpeg.Essentials
    repository:
      owner: hyperpuncher
      name: winget-pkgs
      branch: "{{.ProjectName}}-{{.Version}}"
      token: "{{ .Env.GH_PAT }}"
      pull_request:
        enabled: true
        draft: false
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master

aurs:
  - name: chough-bin
    description: Fast ASR CLI using Parakeet TDT 0.6b V3
    homepage: https://github.com/hyperpuncher/chough
    license: MIT
    maintainers:
      - hyperpuncher
    provides: [chough]
    conflicts: [chough]
    depends: [ffmpeg]
    git_url: ssh://aur@aur.archlinux.org/chough-bin.git
    private_key: "{{ .Env.AUR_KEY }}"
    package: |-
      # Install binary and libraries to /opt/chough/
      install -dm755 "${pkgdir}/opt/chough"
      install -Dm755 "./chough" "${pkgdir}/opt/chough/chough"
      install -Dm644 "./"*.so "${pkgdir}/opt/chough/"

      # Symlink binary to /usr/bin/
      install -dm755 "${pkgdir}/usr/bin"
      ln -sf "/opt/chough/chough" "${pkgdir}/usr/bin/chough"

dockers_v2:
  - id: chough
    ids: [linux-amd64]
    platforms: [linux/amd64]
    images: [ghcr.io/hyperpuncher/chough]
    tags:
      - latest
      - "{{ .Tag }}"
      - "v{{ .Major }}"
      - "v{{ .Major }}.{{ .Minor }}"
    dockerfile: Dockerfile.goreleaser
    flags: ["--pull"]
    labels:
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.version: "{{ .Version }}"
    extra_files:
      - .tmp-libbundle/current/linux_amd64/libonnxruntime.so
      - .tmp-libbundle/current/linux_amd64/libsherpa-onnx-c-api.so
      - .tmp-libbundle/current/linux_amd64/libsherpa-onnx-cxx-api.so
